; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = cyd

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bodmer/TJpg_Decoder
build_flags =
    -D BOARD_CYD=1
    -D USER_SETUP_LOADED=1
    -D RND_SEED_PIN=34
    -D HARD_BREAK_PIN=0
; DISPLAY
    -D DISPLAY_ENABLED=1
    -D LOAD_GLCD=1
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=16000000
    -D TFT_BL=27
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_SCLK=14
    -D TFT_MOSI=13
    -D TFT_MISO=12
;--320x480--
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
;--240x320--
;    -D ST7789_DRIVER=1
;    -D TFT_WIDTH=240
;    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
; TOUCH
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
; SDCARD
    -D SYS_SD_CS=5
    -D SYS_SD_CLK=18
    -D SYS_SD_CMD=23
    -D SYS_SD_D0=19
; AUDIO
    -D AUDIO_DATA_PIN=26
    -D AUDIO_EN_PIN=4
; SERIAL
    -D SYS_UART_TX=32
    -D SYS_UART_RX=25
; DEVELOPMENT
;    -D SERIAL_DEBUG=1
;    -D CORE_DEBUG_LEVEL=5
;    -D CONFIG_HEAP_POISONING_COMPREHENSIVE=1
;    -D CONFIG_HEAP_TRACING=1
;    -D ARDUINO_LOOP_STACK_SIZE=16384


[env:jc]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = JC3248W535C
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.5
    bodmer/TJpg_Decoder
build_flags =
    -D BOARD_JC3248=1
    -D RND_SEED_PIN=10
    -D HARD_BREAK_PIN=0
; DISPLAY
    -D DISPLAY_ENABLED=1
    -D AXS15231B_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D SPI_FREQUENCY=80000000
    -D TFT_BL=1
    -D TFT_CS=45
    -D TFT_SCK=47
    -D TFT_D0=21
    -D TFT_D1=48
    -D TFT_D2=40
    -D TFT_D3=39
; TOUCH
    -D TOUCH_INT=3
    -D TOUCH_SDA=4
    -D TOUCH_SCL=8
    -D TOUCH_FREQUENCY=2500000
; SDCARD
    -D SYS_SD_CS=-1
    -D SYS_SD_CLK=12
    -D SYS_SD_CMD=11
    -D SYS_SD_D0=13
; AUDIO
    -D AUDIO_DATA_PIN=9
    -D AUDIO_EN_PIN=14
; SERIAL
    -D SYS_UART_TX=17
    -D SYS_UART_RX=18
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
; DEVELOPMENT
;    -D SERIAL_DEBUG=1
;    -D BOARD_HAS_PSRAM=1
;    -D CORE_DEBUG_LEVEL=5
;    -D CONFIG_HEAP_POISONING_COMPREHENSIVE=1
;    -D CONFIG_HEAP_TRACING=1
;    -D ARDUINO_LOOP_STACK_SIZE=16384
